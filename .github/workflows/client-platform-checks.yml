name: Purohit Platform Checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/purohit-client/**'
      - '.github/workflows/client-platform-checks.yml'
  pull_request:
    paths:
      - 'apps/purohit-client/**'
      - '.github/workflows/client-platform-checks.yml'

jobs:
  expo-doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/purohit-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/purohit-client/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - run: npm run export:web
