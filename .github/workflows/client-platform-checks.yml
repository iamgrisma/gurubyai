name: Purohit Platform Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/purohit-client/**'
      - '.github/workflows/client-platform-checks.yml'
  pull_request:
    paths:
      - 'apps/purohit-client/**'
      - '.github/workflows/client-platform-checks.yml'

permissions:
  contents: read

jobs:
  expo-doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/purohit-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/purohit-client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo-doctor
      - run: npm run export:web
      - run: npm run production:smoke

  bootstrap-native-location:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/purohit-client/package-lock.json

      - name: Ensure Expo Location dependency
        working-directory: apps/purohit-client
        run: npm install --package-lock-only expo-location@~19.0.8 --ignore-scripts --no-audit --no-fund

      - name: Apply native current-location UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          loc = Path("apps/purohit-client/app/locations.tsx")
          s = loc.read_text()
          replacements = [
            (
              "import { ActivityIndicator, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';",
              "import { ActivityIndicator, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';\nimport { getCurrentLocation } from '../src/platform/current-location';"
            ),
            (
              "  const [error, setError] = useState('');",
              "  const [error, setError] = useState('');\n  const [locating, setLocating] = useState(false);"
            ),
            (
              """  function chooseResult(result: LocationSearchResult) {
            setAddress(result.display_name);
            setLat(result.lat);
            setLng(result.lon);
            setResults([]);
            setSearch(result.display_name);
            setError('');
          }

          """,
              """  function chooseResult(result: LocationSearchResult) {
            setAddress(result.display_name);
            setLat(result.lat);
            setLng(result.lon);
            setResults([]);
            setSearch(result.display_name);
            setError('');
          }

          async function useCurrent() {
            setError('');
            setLocating(true);
            try {
              const current = await getCurrentLocation();
              setLat(String(current.latitude));
              setLng(String(current.longitude));
              setSearch('Current device location');
              if (!name.trim()) setName('Current location');
              try {
                const reverse = await api.reverseLocation(current.latitude, current.longitude);
                const label = reverse.display_name ?? 'Current device location';
                setAddress(label);
                setSearch(label);
              } catch {
                setAddress('Current device location');
              }
            } catch (e) {
              setError(e instanceof Error ? e.message : 'Unable to read the current device location.');
            } finally {
              setLocating(false);
            }
          }

          """
            ),
            (
              """          <Text style={styles.sectionTitle}>Add a location</Text>
          <Text style={styles.muted}>
            Search the address first so the coordinates are filled for you.
          </Text>

          """,
              """          <Text style={styles.sectionTitle}>Add a location</Text>
          <Text style={styles.muted}>
            Search the address first, or use your current device location. Permission is requested only when you choose that action.
          </Text>
          <Pressable
            accessibilityRole="button"
            accessibilityLabel="Use current device location"
            disabled={locating}
            onPress={useCurrent}
            style={[styles.secondaryAction, locating && styles.disabled]}
          >
            <Text style={styles.secondaryActionText}>{locating ? 'Locating…' : 'Use current location'}</Text>
          </Pressable>

          """
            ),
            (
              "  searchButtonText: { color: '#fff', fontWeight: '800' },",
              "  searchButtonText: { color: '#fff', fontWeight: '800' },\n  secondaryAction: { borderWidth: 1, borderColor: theme.colors.line, backgroundColor: theme.colors.surface, padding: 14, borderRadius: theme.radius.md, alignItems: 'center' },\n  secondaryActionText: { color: theme.colors.ink, fontWeight: '800' },"
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit("locations.tsx anchor missing")
            s = s.replace(old, new, 1)
          loc.write_text(s)

          book = Path("apps/purohit-client/app/book/[serviceId].tsx")
          s = book.read_text()
          replacements = [
            (
              "import{Card,ErrorState,InlineNotice,PriceBreakdown,StatusBadge}from'../../src/ui/components';",
              "import{Card,ErrorState,InlineNotice,PriceBreakdown,StatusBadge}from'../../src/ui/components';\nimport{getCurrentLocation}from'../../src/platform/current-location';"
            ),
            (
              " const[locationSearch,setLocationSearch]=useState('');const[locationResults,setLocationResults]=useState<LocationSearchResult[]>([]);const[locationSearching,setLocationSearching]=useState(false);",
              " const[locationSearch,setLocationSearch]=useState('');const[locationResults,setLocationResults]=useState<LocationSearchResult[]>([]);const[locationSearching,setLocationSearching]=useState(false);const[locating,setLocating]=useState(false);"
            ),
            (
              " function chooseLocation(result:LocationSearchResult){setLocationId(null);setLocationSearch(result.display_name);setLocationAddress(result.display_name);setLocationLat(result.lat);setLocationLng(result.lon);setLocationResults([])}\n",
              " function chooseLocation(result:LocationSearchResult){setLocationId(null);setLocationSearch(result.display_name);setLocationAddress(result.display_name);setLocationLat(result.lat);setLocationLng(result.lon);setLocationResults([])}\n async function useCurrentLocation(){setLocating(true);try{const current=await getCurrentLocation();setLocationId(null);setLocationSearch('Current device location');setLocationLat(String(current.latitude));setLocationLng(String(current.longitude));setLocationResults([]);try{const reverse=await api.reverseLocation(current.latitude,current.longitude);const label=reverse.display_name??'Current device location';setLocationAddress(label);setLocationSearch(label)}catch{setLocationAddress('Current device location')}}catch(e){alert(e instanceof Error?e.message:'Unable to read the current device location.')}finally{setLocating(false)}}\n"
            ),
            (
              "  {mode==='physical'&&<Card><Text style={s.sectionSmall}>Service location</Text>{saved.data?.length?",
              "  {mode==='physical'&&<Card><Text style={s.sectionSmall}>Service location</Text><Text style={s.muted}>Choose a saved address, search for one, or use your current device location. Permission is requested only after you press the button.</Text><Pressable accessibilityRole=\"button\" disabled={locating} onPress={useCurrentLocation} style={[s.locationAction,locating&&s.disabled]}><Text style={s.locationActionText}>{locating?'Locating…':'Use current location'}</Text></Pressable>{saved.data?.length?"
            ),
            (
              "location:{padding:12,borderRadius:12,borderWidth:1,borderColor:theme.colors.line,backgroundColor:'#fff',gap:4},",
              "location:{padding:12,borderRadius:12,borderWidth:1,borderColor:theme.colors.line,backgroundColor:'#fff',gap:4},locationAction:{padding:13,borderRadius:12,borderWidth:1,borderColor:theme.colors.line,backgroundColor:'#fff',alignItems:'center'},locationActionText:{color:theme.colors.ink,fontWeight:'800'},"
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit("booking screen anchor missing")
            s = s.replace(old, new, 1)
          book.write_text(s)

          app = Path("apps/purohit-client/app.json")
          data = json.loads(app.read_text())
          plugins = data["expo"]["plugins"]
          target = ["expo-location", {"locationWhenInUsePermission": "Purohit uses your location only when you choose to set a service visit location."}]
          if not any(isinstance(p, list) and p and p[0] == "expo-location" for p in plugins):
            plugins.append(target)
          app.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git status --short
          git add apps/purohit-client/package.json apps/purohit-client/package-lock.json apps/purohit-client/app/locations.tsx "apps/purohit-client/app/book/[serviceId].tsx" apps/purohit-client/app.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No additional changes are required."
            exit 0
          fi
          git commit -m "feat(client): wire native current-location flow"
          git push origin HEAD:${GITHUB_REF_NAME}
