name: Native Location Bootstrap

on:
  push:
    branches:
      - automation/bootstrap-expo-location

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/purohit-client/package-lock.json
      - name: Install dependency
        run: |
          cd apps/purohit-client
          npm install --package-lock-only expo-location@~19.0.8 --ignore-scripts --no-audit --no-fund
      - name: Patch native location UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path("apps/purohit-client/app/locations.tsx")
          s=p.read_text()
          s=s.replace("import { ActivityIndicator, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';","import { ActivityIndicator, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';\nimport { getCurrentLocation } from '../src/platform/current-location';")
          s=s.replace("  const [error, setError] = useState('');","  const [error, setError] = useState('');\n  const [locating, setLocating] = useState(false);")
          anchor="  function chooseResult(result: LocationSearchResult) {\n    setAddress(result.display_name);\n    setLat(result.lat);\n    setLng(result.lon);\n    setResults([]);\n    setSearch(result.display_name);\n    setError('');\n  }\n"
          s=s.replace(anchor,anchor+"\n  async function useCurrent() {\n    setError('');\n    setLocating(true);\n    try {\n      const current = await getCurrentLocation();\n      setLat(String(current.latitude));\n      setLng(String(current.longitude));\n      setSearch('Current device location');\n      if (!name.trim()) setName('Current location');\n      try {\n        const reverse = await api.reverseLocation(current.latitude, current.longitude);\n        const label = reverse.display_name ?? 'Current device location';\n        setAddress(label);\n        setSearch(label);\n      } catch { setAddress('Current device location'); }\n    } catch (e) {\n      setError(e instanceof Error ? e.message : 'Unable to read the current device location.');\n    } finally { setLocating(false); }\n  }\n",1)
          anchor="          <Text style={styles.sectionTitle}>Add a location</Text>\n          <Text style={styles.muted}>\n            Search the address first so the coordinates are filled for you.\n          </Text>\n"
          s=s.replace(anchor,anchor+"          <Pressable accessibilityRole=\"button\" accessibilityLabel=\"Use current device location\" disabled={locating} onPress={useCurrent} style={[styles.secondaryAction, locating && styles.disabled]}>\n            <Text style={styles.secondaryActionText}>{locating ? 'Locating…' : 'Use current location'}</Text>\n          </Pressable>\n",1)
          s=s.replace("  searchButtonText: { color: '#fff', fontWeight: '800' },","  searchButtonText: { color: '#fff', fontWeight: '800' },\n  secondaryAction: { borderWidth: 1, borderColor: theme.colors.line, backgroundColor: theme.colors.surface, padding: 14, borderRadius: theme.radius.md, alignItems: 'center' },\n  secondaryActionText: { color: theme.colors.ink, fontWeight: '800' },",1)
          p.write_text(s)

          p=Path("apps/purohit-client/app/book/[serviceId].tsx")
          s=p.read_text()
          s=s.replace("import{Card,ErrorState,InlineNotice,PriceBreakdown,StatusBadge}from'../../src/ui/components';","import{Card,ErrorState,InlineNotice,PriceBreakdown,StatusBadge}from'../../src/ui/components';\nimport{getCurrentLocation}from'../../src/platform/current-location';",1)
          s=s.replace(" const[locationSearch,setLocationSearch]=useState('');const[locationResults,setLocationResults]=useState<LocationSearchResult[]>([]);const[locationSearching,setLocationSearching]=useState(false);"," const[locationSearch,setLocationSearch]=useState('');const[locationResults,setLocationResults]=useState<LocationSearchResult[]>([]);const[locationSearching,setLocationSearching]=useState(false);const[locating,setLocating]=useState(false);",1)
          anchor=" function chooseLocation(result:LocationSearchResult){setLocationId(null);setLocationSearch(result.display_name);setLocationAddress(result.display_name);setLocationLat(result.lat);setLocationLng(result.lon);setLocationResults([])}"
          s=s.replace(anchor,anchor+"\n async function useCurrentLocation(){setLocating(true);try{const current=await getCurrentLocation();setLocationId(null);setLocationSearch('Current device location');setLocationLat(String(current.latitude));setLocationLng(String(current.longitude));setLocationResults([]);try{const reverse=await api.reverseLocation(current.latitude,current.longitude);const label=reverse.display_name??'Current device location';setLocationAddress(label);setLocationSearch(label)}catch{setLocationAddress('Current device location')}}catch(e){alert(e instanceof Error?e.message:'Unable to read the current device location.')}finally{setLocating(false)}}",1)
          anchor="  {mode==='physical'&&<Card><Text style={s.sectionSmall}>Service location</Text>{saved.data?.length?"
          s=s.replace(anchor,"  {mode==='physical'&&<Card><Text style={s.sectionSmall}>Service location</Text><Text style={s.muted}>Choose a saved address, search for one, or use your current device location. Permission is requested only after you press the button.</Text><Pressable accessibilityRole=\"button\" disabled={locating} onPress={useCurrentLocation} style={[s.locationAction,locating&&s.disabled]}><Text style={s.locationActionText}>{locating?'Locating…':'Use current location'}</Text></Pressable>{saved.data?.length?",1)
          s=s.replace("location:{padding:12,borderRadius:12,borderWidth:1,borderColor:theme.colors.line,backgroundColor:'#fff',gap:4},","location:{padding:12,borderRadius:12,borderWidth:1,borderColor:theme.colors.line,backgroundColor:'#fff',gap:4},locationAction:{padding:13,borderRadius:12,borderWidth:1,borderColor:theme.colors.line,backgroundColor:'#fff',alignItems:'center'},locationActionText:{color:theme.colors.ink,fontWeight:'800'},",1)
          p.write_text(s)

          p=Path("apps/purohit-client/app.json")
          data=json.loads(p.read_text())
          ps=data["expo"]["plugins"]
          if not any(isinstance(x,list) and x and x[0]=="expo-location" for x in ps):
              ps.append(["expo-location",{"locationWhenInUsePermission":"Purohit uses your location only when you choose to set a service visit location."}])
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add apps/purohit-client/package.json apps/purohit-client/package-lock.json apps/purohit-client/app/locations.tsx "apps/purohit-client/app/book/[serviceId].tsx" apps/purohit-client/app.json
          git diff --cached --check
          rm -f .github/workflows/native-location-bootstrap.yml
          git add .github/workflows/native-location-bootstrap.yml
          git commit -m "feat(client): wire native current-location flow"
          git push origin HEAD:${GITHUB_REF_NAME}
