name: Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # These are public Supabase client values; NEXT_PUBLIC_* values are shipped to the browser.
      # Keep the workflow usable even when repository secrets are not configured.
      NEXT_PUBLIC_SUPABASE_URL: https://axctxzjqnxbloxakhhmx.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4Y3R4empxbnhibG94YWtoaG14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzODYwNTQsImV4cCI6MjA3ODk2MjA1NH0.nZN3faVe4XiNot3Y2IiTTsprQPhPREfOb9D3Z6kU6-w
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  backend-contracts:
    runs-on: ubuntu-latest
    environment: SUPABASE_DB_URL
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backend contract suite
        run: node scripts/run-backend-contract-tests.mjs
