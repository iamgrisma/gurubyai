name: Repair Purohit Client Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/purohit-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/purohit-client/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/purohit-client/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "build(client): repair Purohit dependency lockfile"
            git push
          fi
