name: Purohit Client Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/purohit-client/**'
      - '.github/workflows/client-build.yml'
  pull_request:
    paths:
      - 'apps/purohit-client/**'
      - '.github/workflows/client-build.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/purohit-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/purohit-client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/purohit-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/purohit-client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run export:web
      - run: test -f dist/index.html
      - run: npm run production:smoke
