openapi: 3.0.3
info:
  title: GurubyAI Backend API
  version: 1.1.0
  description: Authoritative RPC contract for web and Android clients.
servers:
  - url: https://axctxzjqnxbloxakhhm.supabase.co
security:
  - bearerAuth: []
paths:
  /rpc/book_service_idempotent:
    post:
      operationId: bookService
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookServiceRequest'}}}}
      responses: {'200': {description: Booking UUID returned.}}
  /rpc/confirm_booking:
    post:
      operationId: confirmBooking
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookingId'}}}}
      responses: {'200': {description: Confirmed.}}
  /rpc/propose_booking_time:
    post:
      operationId: proposeBookingTime
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProposalRequest'}}}}
      responses: {'200': {description: Proposal created.}}
  /rpc/respond_booking_time:
    post:
      operationId: respondBookingTime
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResponseRequest'}}}}
      responses: {'200': {description: Response recorded.}}
  /rpc/reschedule_booking:
    post:
      operationId: rescheduleBooking
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RescheduleRequest'}}}}
      responses: {'200': {description: Rescheduled.}}
  /rpc/cancel_booking:
    post:
      operationId: cancelBooking
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookingId'}}}}
      responses: {'200': {description: Cancelled.}}
  /rpc/complete_booking:
    post:
      operationId: completeBooking
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookingId'}}}}
      responses: {'200': {description: Completed.}}
  /rpc/request_topup:
    post:
      operationId: requestTopup
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TopupRequest'}}}}
      responses: {'200': {description: Top-up requested.}}
  /rpc/approve_topup_request:
    post:
      operationId: approveTopup
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookingId'}}}}
      responses: {'200': {description: Approved.}}
  /rpc/reject_topup_request:
    post:
      operationId: rejectTopup
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookingId'}}}}
      responses: {'200': {description: Rejected.}}
  /rpc/get_my_profile:
    post:
      operationId: getMyProfile
      responses: {'200': {description: Explicit private profile projection.}}
  /rpc/get_public_gurubas:
    post:
      operationId: getPublicGurubas
      responses: {'200': {description: Verified Guruba projection.}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    BookingId:
      type: object
      required: [p_booking_id]
      properties: {p_booking_id: {type: string, format: uuid}}
    BookServiceRequest:
      type: object
      required: [p_user_id,p_guruba_id,p_service_id,p_platform_fee,p_request_key]
      properties:
        p_user_id: {type: string, format: uuid}
        p_guruba_id: {type: string, format: uuid}
        p_service_id: {type: string, format: uuid}
        p_scheduled_at: {type: string, format: date-time, nullable: true}
        p_platform_fee: {type: integer, minimum: 0}
        p_location_lat: {type: number, nullable: true}
        p_location_lng: {type: number, nullable: true}
        p_location_address: {type: string, nullable: true}
        p_proposed_time: {type: string, format: date-time, nullable: true}
        p_booking_note: {type: string, nullable: true}
        p_is_custom_booking: {type: boolean}
        p_is_online: {type: boolean}
        p_request_key: {type: string, minLength: 8, maxLength: 128}
    ProposalRequest:
      type: object
      required: [p_booking_id,p_proposed_time]
      properties:
        p_booking_id: {type: string, format: uuid}
        p_proposed_time: {type: string, format: date-time}
        p_confirmation_deadline: {type: string, format: date-time, nullable: true}
    ResponseRequest:
      type: object
      required: [p_booking_id,p_accept]
      properties:
        p_booking_id: {type: string, format: uuid}
        p_accept: {type: boolean}
    RescheduleRequest:
      type: object
      required: [p_booking_id,p_new_scheduled_at]
      properties:
        p_booking_id: {type: string, format: uuid}
        p_new_scheduled_at: {type: string, format: date-time}
    TopupRequest:
      type: object
      required: [p_amount]
      properties:
        p_amount: {type: integer, minimum: 1, maximum: 1000000}
